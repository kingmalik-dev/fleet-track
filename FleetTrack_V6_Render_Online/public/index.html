<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FleetTrack V3</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><b>🚚 FleetTrack</b><span id="who"></span><button onclick="location.reload()">Logout</button></header>
<section id="login" class="login"><div class="card"><h1>FleetTrack</h1><p>Online Fleet Monitoring</p><input id="u" value="admin" placeholder="Username"><input id="p" type="password" value="1234" placeholder="Password"><button class="primary" onclick="login()">Sign In</button><small>Demo: admin/1234 · driver/1234</small></div></section>
<main id="admin" class="hide"><div class="stats"><div><small>Trucks</small><b id="a">0</b></div><div><small>Moving</small><b id="b">0</b></div><div><small>Arrived</small><b id="c">0</b></div><div><small>Offline</small><b id="d">0</b></div></div><div class="grid"><div class="card"><h2>Live Map</h2><div id="map"></div></div><div class="card"><h2>Fleet</h2><button onclick="addTruck()">+ Truck</button><div id="fleet"></div></div></div><div class="card"><div class="title"><h2>Driver Accounts</h2><button onclick="addDriver()">+ Driver</button></div><div id="drivers"></div></div><div class="card"><div class="title"><h2>Trip Tickets</h2><div><button onclick="addTrip()">+ Trip</button><a href="/api/export">Export CSV</a></div></div><div id="trips"></div></div></main>
<main id="driver" class="hide"><div class="card"><h2>Driver Trip</h2><div id="dt"></div><div class="gps" id="gps">Requesting GPS…</div><label>Odometer (km)</label><input id="odo" type="number"><div class="actions"><button class="primary" onclick="startTrip()">Start Trip</button><button onclick="depart()">Record Departure</button></div><label>Proof-of-arrival photo</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="photo()"></div></main>
<script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
